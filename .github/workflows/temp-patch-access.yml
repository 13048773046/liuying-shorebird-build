name: Temporary patch access

on:
  push:
    branches: [main]
    paths:
      - temp-patch-access.txt

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append temporary public key
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PASS: ${{ secrets.PROD_PASS }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user --break-system-packages paramiko
          python3 - <<'PY'
          import os, shlex, paramiko
          key = open('temp-patch-access.txt').read().strip()
          assert key.startswith('ssh-ed25519 ')
          c = paramiko.SSHClient()
          c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          c.connect(os.environ['PROD_HOST'], username='root', password=os.environ['PROD_PASS'], timeout=20)
          q = shlex.quote(key)
          cmd = (
              'mkdir -p /root/.ssh && touch /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys && '
              f'(grep -qF {q} /root/.ssh/authorized_keys || printf "\\n%s\\n" {q} >> /root/.ssh/authorized_keys) && '
              f'grep -cF {q} /root/.ssh/authorized_keys'
          )
          stdin, stdout, stderr = c.exec_command(cmd)
          out = stdout.read().decode()
          err = stderr.read().decode()
          code = stdout.channel.recv_exit_status()
          print('authorized_count', out.strip(), 'exit', code)
          if err.strip():
              print('stderr', err.strip())
          c.close()
          if code != 0:
              raise SystemExit(code)
          PY
