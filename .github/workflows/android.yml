name: Build Shorebird Android baseline

on:
  push:
    branches: [main]
    paths:
      - android-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download Flutter source
        run: |
          set -euo pipefail
          curl -fSL --retry 5 --max-time 600 "https://www.dbmt999.asia/community/files/community_src_0.9.55_shorebird.tar.gz" -o /tmp/source.tar.gz
          mkdir -p source
          tar -xzf /tmp/source.tar.gz -C source

      - name: Create local git baseline
        working-directory: source
        run: |
          git init -q
          git config user.email "ci@liuying.local"
          git config user.name "liuying-ci"
          git add -A
          git commit -q -m "shorebird android baseline 0.9.55+126"

      - name: Install Shorebird
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://shorebird.dev/install.sh | bash
          test -x "$HOME/.shorebird/bin/shorebird"
          "$HOME/.shorebird/bin/shorebird" --version

      - name: Restore Shorebird login
        env:
          SHOREBIRD_CREDENTIALS: ${{ secrets.SHOREBIRD_CREDENTIALS }}
        run: |
          set -euo pipefail
          for dir in "$HOME/.shorebird" "$HOME/.config/shorebird" "$HOME/.local/share/shorebird"; do
            mkdir -p "$dir"
            printf '%s' "$SHOREBIRD_CREDENTIALS" > "$dir/credentials-v2.json"
            chmod 600 "$dir/credentials-v2.json"
          done

      - name: Verify Shorebird login
        run: |
          "$HOME/.shorebird/bin/shorebird" auth status

      - name: Build Shorebird APK
        working-directory: source
        run: |
          set -o pipefail
          "$HOME/.shorebird/bin/shorebird" release android --artifact apk --build-name 0.9.55 --build-number 126 2>&1 | tee /tmp/android-build.log

      - name: Locate APK
        id: apk
        working-directory: source
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs -name '*.apk' -type f | head -1)
          test -n "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK to production
        env:
          APK_PATH: ${{ steps.apk.outputs.apk }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PASS: ${{ secrets.PROD_PASS }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user paramiko
          python3 - <<'PY'
          import hashlib, os, paramiko
          src = os.path.join('source', os.environ['APK_PATH'])
          data = open(src, 'rb').read()
          digest = hashlib.sha256(data).hexdigest()[:20]
          name = f'community_pkg_{digest}.apk'
          c = paramiko.SSHClient()
          c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          c.connect(os.environ['PROD_HOST'], username='root', password=os.environ['PROD_PASS'], timeout=20)
          s = c.open_sftp()
          remote = '/www/wwwroot/Yosar-community/files/' + name
          s.put(src, remote)
          s.chmod(remote, 0o644)
          print('APK_BYTES', os.path.getsize(src))
          print('APK_SHA256', hashlib.sha256(data).hexdigest())
          print('APK_URL', 'https://www.dbmt999.asia/community/files/' + name)
          s.close()
          c.close()
          PY
