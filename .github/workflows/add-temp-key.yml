name: Add temporary patch SSH key

on:
  push:
    branches: [main]
    paths:
      - ssh-key-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install temporary public key
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PASS: ${{ secrets.PROD_PASS }}
        run: |
          set -euo pipefail
          test -f ssh-key-trigger.txt
          KEY=$(grep -m1 '^ssh-ed25519 ' ssh-key-trigger.txt)
          test -n "$KEY"
          ASKPASS=$(mktemp)
          printf '#!/bin/sh\necho "%s"\n' "$PROD_PASS" > "$ASKPASS"
          chmod 700 "$ASKPASS"
          DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force ssh -o StrictHostKeyChecking=no "root@$PROD_HOST" \
            "mkdir -p /root/.ssh && chmod 700 /root/.ssh && touch /root/.ssh/authorized_keys && grep -qxF '$KEY' /root/.ssh/authorized_keys || echo '$KEY' >> /root/.ssh/authorized_keys; chmod 600 /root/.ssh/authorized_keys"
          rm -f "$ASKPASS"
          echo "temporary key installed"
