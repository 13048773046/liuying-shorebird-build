name: Diagnose Shorebird iOS delivery

on:
  push:
    branches: [main]
    paths:
      - diag-trigger.txt

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check iOS patch availability
        run: |
          set -euo pipefail
          cat > /tmp/check.json <<'JSON'
          {"release_version":"0.9.55+126","platform":"ios","arch":"aarch64","app_id":"f8c3d63a-0d9a-411d-9553-fcb7e7232f43","channel":"stable","patch_number":3}
          JSON
          curl -sS -X POST 'https://api.shorebird.dev/api/v1/patches/check' \
            -H 'content-type: application/json' --data-binary @/tmp/check.json | tee /tmp/check-response.json
          echo
          python3 -m json.tool /tmp/check-response.json | head -40

      - name: Fetch Shorebird token and download metrics
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PASS: ${{ secrets.PROD_PASS }}
        run: |
          set -euo pipefail
          ASKPASS=$(mktemp)
          printf '#!/bin/sh\necho "%s"\n' "$PROD_PASS" > "$ASKPASS"
          chmod 700 "$ASKPASS"
          DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force ssh -o StrictHostKeyChecking=no "root@$PROD_HOST" 'cat /root/.shorebird_token' > /tmp/shorebird_token
          test -s /tmp/shorebird_token
          rm -f "$ASKPASS"
          curl -sS -H "Authorization: Bearer $(cat /tmp/shorebird_token)" \
            'https://api.shorebird.dev/api/v1/apps/f8c3d63a-0d9a-411d-9553-fcb7e7232f43/releases/1005608/metrics/patch-downloads?start=2026-11-23T00:00:00Z&granularity=hour&group_by=patch' \
            -o /tmp/downloads.json
          curl -sS -H "Authorization: Bearer $(cat /tmp/shorebird_token)" \
            'https://api.shorebird.dev/api/v1/apps/f8c3d63a-0d9a-411d-9553-fcb7e7232f43/releases/1005608/metrics/patch-installs?start=2026-11-23T00:00:00Z&granularity=hour&group_by=patch' \
            -o /tmp/installs.json
          python3 - <<'PY'
          import json
          for name in ['downloads','installs']:
              data=json.load(open(f'/tmp/{name}.json'))
              print('===',name)
              print(json.dumps(data, ensure_ascii=False)[:3000])
          PY

      - name: Inspect release signing metadata
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/shorebird_token)
          APP=f8c3d63a-0d9a-411d-9553-fcb7e7232f43
          echo '=== signing-key ==='
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://api.shorebird.dev/api/v1/apps/$APP/signing-key" | tee /tmp/signing-key.json
          echo
          echo '=== release ==='
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://api.shorebird.dev/api/v1/apps/$APP/releases/1005608" | tee /tmp/release.json
          echo
          echo '=== ios release artifacts ==='
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://api.shorebird.dev/api/v1/apps/$APP/releases/1005608/artifacts?platform=ios" | tee /tmp/artifacts.json
          echo
          echo '=== patches ==='
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://api.shorebird.dev/api/v1/apps/$APP/releases/1005608/patches" | tee /tmp/patches.json
          echo
          python3 - <<'PY'
          import json, re, urllib.request
          key=json.load(open('/tmp/signing-key.json'))
          print('SIGNING_KEY', json.dumps(key, ensure_ascii=False)[:500])
          rel=json.load(open('/tmp/release.json'))
          print('RELEASE', json.dumps(rel, ensure_ascii=False)[:2000])
          arts=json.load(open('/tmp/artifacts.json'))
          print('ARTIFACTS', json.dumps(arts, ensure_ascii=False)[:2000])
          patches=json.load(open('/tmp/patches.json'))
          print('PATCHES', json.dumps(patches, ensure_ascii=False)[:2000])
          # Compare with the public key embedded in the exact public baseline IPA.
          ipa='/tmp/baseline.ipa'
          urllib.request.urlretrieve('https://www.dbmt999.asia/community/files/community_ipa_0.9.55_hotfix_unsigned.ipa', ipa)
          import zipfile
          with zipfile.ZipFile(ipa) as z:
              text=z.read('Payload/Runner.app/Frameworks/App.framework/flutter_assets/shorebird.yaml').decode()
          m=re.search(r'patch_public_key: *(.+)', text)
          baseline=m.group(1).strip() if m else ''
          server=(key.get('signing_key') or {}).get('public_key_pem','').strip()
          print('BASELINE_KEY_SHA256', __import__('hashlib').sha256(baseline.encode()).hexdigest())
          print('SERVER_KEY_SHA256', __import__('hashlib').sha256(server.encode()).hexdigest())
          print('KEYS_MATCH', baseline == server)
          print('BASELINE_KEY_PREFIX', baseline[:40])
          print('SERVER_KEY_PREFIX', server[:40])
          PY
