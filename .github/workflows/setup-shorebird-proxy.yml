name: Setup Shorebird reverse proxy

on:
  push:
    branches: [main]
    paths:
      - proxy-trigger.txt

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure nginx proxy on production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PASS: ${{ secrets.PROD_PASS }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$PROD_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no "root@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== reach api.shorebird.dev ==='
          curl -sS -o /dev/null -w 'api_status=%{http_code}\n' --max-time 15 https://api.shorebird.dev/api/v1/status || true
          python3 - <<'PY'
          import re, shutil, subprocess, time, sys
          path='/etc/nginx/conf.d/www.dbmt999.asia.conf'
          text=open(path,encoding='utf-8').read()
          def find_block(t, start):
              i=t.index('{', start)
              depth=0
              for j in range(i, len(t)):
                  if t[j]=='{': depth+=1
                  elif t[j]=='}':
                      depth-=1
                      if depth==0: return i,j
              raise ValueError('unbalanced')
          while True:
              m=re.search(r'location\s+/shorebird-api/', text)
              if not m: break
              i,j=find_block(text, m.start())
              line_start=text.rfind('\n',0,m.start())+1
              text=text[:line_start]+text[j+1:]
          servers=[]
          for m in re.finditer(r'\bserver\s*{', text):
              i,j=find_block(text, m.start())
              servers.append((m.start(),i,j))
          block='\n'.join([
              '    location /shorebird-api/ {',
              '        proxy_pass https://api.shorebird.dev/;',
              '        proxy_ssl_server_name on;',
              '        proxy_ssl_name api.shorebird.dev;',
              '        proxy_set_header Host api.shorebird.dev;',
              '        proxy_set_header X-Real-IP $remote_addr;',
              '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;',
              '        proxy_http_version 1.1;',
              '        proxy_set_header Connection "";',
              '        proxy_connect_timeout 10s;',
              '        proxy_read_timeout 60s;',
              '        proxy_buffering off;',
              '        client_max_body_size 20m;',
              '    }',
          ])+'\n'
          inserts=[]
          for start,i,j in servers:
              body=text[i:j+1]
              if not re.search(r'server_name[^;]*www\.dbmt999\.asia', body): continue
              if 'shorebird-api' in body: continue
              if not (re.search(r'listen[^;]*443', body) or 'ssl_certificate' in body): continue
              sm=re.search(r'server_name[^;]*www\.dbmt999\.asia[^;]*;', body)
              if not sm: continue
              inserts.append(i+sm.end())
          if not inserts:
              print('NO_SSL_SERVER_BLOCK'); sys.exit(1)
          for pos in sorted(inserts, reverse=True):
              text=text[:pos]+block+text[pos:]
          bak=path+'.bak.shorebird.'+time.strftime('%Y%m%d%H%M%S')
          shutil.copy2(path,bak)
          open(path,'w',encoding='utf-8').write(text)
          print('BACKUP',bak,'INSERTS',len(inserts))
          test=subprocess.run(['nginx','-t'],capture_output=True,text=True)
          print(test.stdout,test.stderr)
          if test.returncode!=0: sys.exit(2)
          subprocess.run(['nginx','-s','reload'],check=True)
          print('NGINX_RELOADED')
          PY
          echo '=== proxy check ==='
          curl -sS -o /tmp/proxy_check.json -w 'proxy_status=%{http_code}\n' --max-time 20 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"app_id":"f8c3d63a-0d9a-411d-9553-fcb7e7232f43","release_version":"0.9.55+126","platform":"ios","arch":"aarch64","channel":"stable","patch_number":0}' \
            https://www.dbmt999.asia/shorebird-api/api/v1/patches/check || true
          head -c 600 /tmp/proxy_check.json || true
          echo
          echo '=== direct check ==='
          curl -sS -o /dev/null -w 'direct_status=%{http_code}\n' --max-time 20 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"app_id":"f8c3d63a-0d9a-411d-9553-fcb7e7232f43","release_version":"0.9.55+126","platform":"ios","arch":"aarch64","channel":"stable","patch_number":0}' \
            https://api.shorebird.dev/api/v1/patches/check || true
          REMOTE
